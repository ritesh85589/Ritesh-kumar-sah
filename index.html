<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Online Quiz System</h1>
        <p>Test Your Knowledge!</p>
    </header>

    <main class="container">
        <div id="welcome">
            <h2>Welcome to Online Quiz</h2>
            <p>50 questions | 25 minutes | 1 mark each</p>
            <button id="startBtn">Start Quiz</button>
        </div>

        <section id="quiz" hidden>
            <div class="quiz-info">
                <span id="questionNumber"></span>
                <span>Time: <b id="timer">25:00</b></span>
            </div>

            <div class="progress-track">
                <div id="progress"></div>
            </div>

            <h2 id="question"></h2>
            <div id="options"></div>

            <div class="buttons">
                <button id="prevBtn">Previous</button>
                <button id="nextBtn">Next</button>
                <button id="submitBtn" hidden>Submit Quiz</button>
            </div>
        </section>

        <section id="result" hidden>
            <h2>Quiz Result</h2>
            <h3 id="score"></h3>
            <p id="message"></p>
            <button id="reviewBtn">Review Answers</button>
            <button id="restartBtn">Restart Quiz</button>
        </section>

        <section id="review" hidden>
            <h2>Answer Review</h2>
            <div id="reviewList"></div>
            <button id="restartReviewBtn">Play Again</button>
        </section>
    </main>

    <footer>
        <p>Diploma CSE College Project | Online Quiz System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
